<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Return</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0f1115;
        color: #f1f3f5;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.35);
        padding: 18px 18px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: rgba(241, 243, 245, 0.82);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.08);
        color: #f1f3f5;
        padding: 10px 12px;
        border-radius: 12px;
        font-weight: 650;
        font-size: 13px;
        cursor: pointer;
      }
      .btn.primary {
        background: #f4b63d;
        border-color: rgba(0,0,0,0.08);
        color: #111;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: rgba(241, 243, 245, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Payment processed</h1>
        <p id="statusText">Opening the app…</p>
        <div class="actions" id="actions" style="display:none;">
          <button class="btn primary" id="openAppBtn" type="button">
            Open app
          </button>
          <button class="btn" id="retryBtn" type="button">Retry</button>
        </div>
        <p class="hint">
          If the app doesn’t open automatically, tap “Open app”. If you still
          don’t see an update, reopen the app — it will verify payment status.
        </p>
      </div>
    </div>
    <script>
      (function () {
        var qs = window.location.search || "";
        var deepPath = "payment-return" + qs;
        var deepLink = "elderassist://" + deepPath;

        var statusText = document.getElementById("statusText");
        var actions = document.getElementById("actions");
        var openAppBtn = document.getElementById("openAppBtn");
        var retryBtn = document.getElementById("retryBtn");

        function tryOpen() {
          statusText.textContent = "Opening the app…";
          // Use custom scheme only. Some browsers will incorrectly jump to
          // Play Store when using intent:// with a non-published app.
          window.location.href = deepLink;

          // Browsers may block auto-open; show a button fallback.
          window.setTimeout(function () {
            actions.style.display = "";
            statusText.textContent = "You can return to the app now.";
          }, 1200);
        }

        openAppBtn.addEventListener("click", function () {
          tryOpen();
        });
        retryBtn.addEventListener("click", function () {
          tryOpen();
        });

        tryOpen();
      })();
    </script>
  </body>
</html>
